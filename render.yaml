services:
  - type: web
    name: freshcycle-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_PORT
        value: "10000"
      - key: LABEL_PARSER_PROVIDER
        value: ocr
      - key: LABEL_PARSER_FALLBACK_PROVIDER
        value: gemini
      - key: OCR_TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: OCR_LANGUAGES
        value: eng+spa
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: API_ALLOWED_ORIGINS
        value: http://localhost:19006,http://127.0.0.1:19006,http://localhost:8081,https://*.vercel.app
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
